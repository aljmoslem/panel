name: Temporary Ubuntu Server (SSH via Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Generate SSH password
        run: |
          PASSWORD=$(openssl rand -base64 16)
          echo "runner:${PASSWORD}" | sudo chpasswd
          echo "SSH_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install & start SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Install cloudflared (no account needed)
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Create TCP tunnel for SSH
        run: |
          cloudflared tunnel --url tcp://localhost:22 > tunnel.log 2>&1 &
          echo "Waiting for tunnel to come up..."
          # wait until the log contains the tcp:// address
          for i in {1..30}; do
            if grep -q 'tcp://' tunnel.log; then
              break
            fi
            sleep 1
          done
          # extract the tcp://host:port line
          TUNNEL_ADDR=$(grep -o 'tcp://[^[:space:]]*' tunnel.log | head -1 | sed 's/tcp:\/\///')
          if [ -z "$TUNNEL_ADDR" ]; then
            echo "❌ Failed to get tunnel address. Log:"
            cat tunnel.log
            exit 1
          fi
          echo "SSH_HOST=$TUNNEL_ADDR" >> $GITHUB_ENV
          echo "✅ Tunnel ready: $TUNNEL_ADDR"

      - name: Print SSH command
        run: |
          echo ""
          echo "============================================"
          echo "  🖥️  Ubuntu Server Ready (6 hours max)"
          echo "============================================"
          echo ""
          echo "  🔑 Password: ${{ env.SSH_PASSWORD }}"
          echo "  🔗 Connect via SSH:"
          echo ""
          echo "      ssh -o StrictHostKeyChecking=no runner@${{ env.SSH_HOST }}"
          echo ""
          echo "  (The host part contains the domain and port,"
          echo "   e.g. sticky-ocean-42.trycloudflare.com:12345)"
          echo ""
          echo "  Once logged in, install 3x-ui:"
          echo "      curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o install.sh"
          echo "      echo '' | sudo bash install.sh"
          echo ""
          echo "  To reach the panel in your browser,"
          echo "  add port forwarding to your SSH command:"
          echo "      ssh -o StrictHostKeyChecking=no -L 8443:localhost:2053 runner@${{ env.SSH_HOST }}"
          echo "      Then open https://localhost:8443 (accept the self-signed cert)"
          echo "============================================"
          # Keep job alive so the tunnel stays open
          tail -f /dev/null
