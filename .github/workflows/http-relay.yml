name: Temporary Ubuntu Server via Ngrok

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours

    steps:
      - name: Generate SSH password
        run: |
          PASSWORD=$(openssl rand -base64 16)
          echo "runner:${PASSWORD}" | sudo chpasswd
          echo "SSH_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install and start SSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Install ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/
          ngrok version

      - name: Authenticate ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: ngrok config add-authtoken $NGROK_AUTH_TOKEN

      - name: Start ngrok TCP tunnel for SSH
        run: |
          ngrok tcp 22 --log=stdout > /dev/null &
          sleep 5
          # Fetch public address from the local ngrok API
          TUNNEL_INFO=$(curl -s localhost:4040/api/tunnels)
          NGROK_URL=$(echo "$TUNNEL_INFO" | jq -r '.tunnels[0].public_url')
          NGROK_HOST=$(echo "$NGROK_URL" | sed 's|tcp://||')
          echo "NGROK_HOST=$NGROK_HOST" >> $GITHUB_ENV

      - name: Print SSH command and password
        run: |
          echo ""
          echo "============================================"
          echo "  🖥️  Ubuntu Server Ready (6 hours max)"
          echo "============================================"
          echo ""
          echo "  SSH command:"
          echo "    ssh -o StrictHostKeyChecking=no runner@${{ env.NGROK_HOST }}"
          echo ""
          echo "  Password: ${{ env.SSH_PASSWORD }}"
          echo ""
          echo "  After login, install 3x-ui with:"
          echo "    curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh -o install.sh"
          echo "    echo '' | sudo bash install.sh"
          echo ""
          echo "  To access the panel in your browser, use port forwarding:"
          echo "    ssh -o StrictHostKeyChecking=no -L 8443:localhost:2053 runner@${{ env.NGROK_HOST }}"
          echo "    Then visit https://localhost:8443 (accept self-signed cert)"
          echo "============================================"
          # Keep the job alive
          tail -f /dev/null
