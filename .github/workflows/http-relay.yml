name: Temporary Ubuntu Server (SSH via tmate)

on:
  workflow_dispatch:

jobs:
  ubuntu-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours

    steps:
      - name: Set up SSH server (optional, but nice to have)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          # Set a password for the runner user (you'll use it only for scp etc., not for tmate)
          echo "runner:$(openssl rand -base64 12)" | sudo chpasswd

      - name: Install tmate
        run: |
          sudo apt-get install -y tmate

      - name: Start tmate session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "============================================"
          echo "  🖥️  Temporary Ubuntu Server is ready!"
          echo "  👤 User: runner (sudo available)"
          echo "  🔗 Connect via tmate:"
          echo ""
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo ""
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo ""
          echo "  (Copy the SSH line above and paste it in your terminal)"
          echo "  ⏰ Session will stay alive for up to 6 hours."
          echo "============================================"
          # Keep the workflow alive
          tail -f /dev/null
